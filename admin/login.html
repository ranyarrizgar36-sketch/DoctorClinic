<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoctorClinic Admin Login</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>🏥 DoctorClinic</h1>

        <h2>Admin Login</h2>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>


<script src="../js/login.js"></script>

</body>
</html>
