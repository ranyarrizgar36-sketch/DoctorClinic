<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>edit Doctor</title>

    <link rel="stylesheet" href="../css/admin.css">

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f5f7fb;
            padding:40px;
        }

        .container{
            max-width:700px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:15px;
            background:#4f46e5;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#372fcf;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>👨‍⚕️ Add Doctor</h1>

    <form id="doctorForm">

        <input
            type="text"
            id="full_name"
            placeholder="Doctor Name"
            required>

        <input
            type="text"
            id="specialization"
            placeholder="Specialization"
            required>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required>

        <input
            type="text"
            id="phone"
            placeholder="Phone"
            required>

        <input
            type="number"
            id="experience"
            placeholder="Years of Experience"
            required>

        <input
            type="text"
            id="image"
            placeholder="Image URL (optional)">

        <button type="submit">
            Add Doctor
        </button>

    </form>

</div>

<script src="../js/edit_doctor.js"></script>

</body>
</html>
