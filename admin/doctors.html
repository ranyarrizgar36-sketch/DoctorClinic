<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors Management</title>

    <link rel="stylesheet" href="../css/admin.css">

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f7fb;
            margin:0;
            padding:40px;
        }

        h1{
            color:#333;
            margin-bottom:20px;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .btn{
            background:#4f46e5;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:8px;
            cursor:pointer;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        th,td{
            padding:15px;
            border-bottom:1px solid #eee;
            text-align:left;
        }

        th{
            background:#4f46e5;
            color:white;
        }

        tr:hover{
            background:#f9f9f9;
        }
    </style>

</head>

<body>

<div class="top-bar">

    <h1>👨‍⚕️ Doctors Management</h1>
    <div style="margin-bottom:20px;">
    <input
        type="text"
        id="searchDoctor"
        placeholder="Search doctor by name..."
        style="
            width:300px;
            padding:10px;
            border:1px solid #ccc;
            border-radius:8px;
        "
    >
</div>

    <button
    class="btn"
    onclick="window.location.href='add_doctor.html'">
    + Add Doctor
</button>

</div>

<table>

    <thead>
    <tr>
        <th>ID</th>
        <th>photo</th>
        <th>Name</th>
        <th>Specialization</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Experience</th>
        <th>Actions</th>
    </tr>
</thead>

    <tbody id="doctorTable">

    </tbody>

</table>

<script src="../js/doctor.js"></script>

</body>
</html>
